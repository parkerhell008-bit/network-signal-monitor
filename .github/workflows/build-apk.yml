name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Diagnose Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms/" || true
          for p in "$ANDROID_HOME"/platforms/android-*; do
            echo "== $p =="
            unzip -l "$p/android.jar" 2>/dev/null | grep -E "telephony/(GsmCellLocation|TelephonyCallback|SignalStrength|CellIdentityNr)\.class" || echo "  (telephony classes NOT found in this jar)"
          done

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-signal-monitor-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
