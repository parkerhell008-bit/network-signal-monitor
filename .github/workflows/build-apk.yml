name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Diagnose Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms/" || true
          for p in "$ANDROID_HOME"/platforms/android-*; do
            echo "== $p =="
            unzip -l "$p/android.jar" 2>/dev/null | grep -E "telephony/(GsmCellLocation|TelephonyCallback|SignalStrength|CellIdentityNr)\.class" || echo "  (telephony classes NOT found in this jar)"
          done

      - name: Install real Android platform 34
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" --install "platforms;android-34" > /dev/null
          echo "=== verify installed jar ==="
          javap -cp "$ANDROID_HOME/platforms/android-34/android.jar" android.telephony.GsmCellLocation | head -5
          javap -cp "$ANDROID_HOME/platforms/android-34/android.jar" android.telephony.SignalStrength | grep -E "getDbm|getLevel" | head -3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission to gradlew
        run: chmod +x android-app/gradlew

      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-signal-monitor-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
